[package]
name = "hd-fantasma-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MCP do HD Fantasma: deixa o Claude consultar o catálogo (só stdio, sem internet)"

[lib]
name = "hdf_mcp"

[[bin]]
name = "hd-fantasma-mcp"
