[workspace]
resolver = "2"
members = ["src-tauri", "crates/core", "crates/mcp"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["Otavio Lima"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
